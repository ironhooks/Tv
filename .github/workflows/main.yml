
name: Google Drive APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP URL or File ID"
        required: true
        type: string

      release_tag:
        description: "GitHub Release Tag"
        required: true
        default: "latest-build"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Download and Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Android SDK
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # 4. Install Android SDK
      - name: Install Android SDK Packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Install Download Tools
      - name: Install Download Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade gdown

      # 6. Download Google Drive ZIP
      - name: Download Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          set -e

          if [ -z "$DRIVE_URL" ]; then
            echo "::error::Google Drive URL missing"
            exit 1
          fi

          FILE_ID=$(python -c '
          import re, sys

          value = sys.argv[1]

          patterns = [
              r"/file/d/([A-Za-z0-9_-]+)",
              r"[?&]id=([A-Za-z0-9_-]+)",
              r"^([A-Za-z0-9_-]{20,})$"
          ]

          for pattern in patterns:
              match = re.search(pattern, value)
              if match:
                  print(match.group(1))
                  break
          ' "$DRIVE_URL")

          if [ -z "$FILE_ID" ]; then
            echo "::error::Invalid Google Drive URL"
            exit 1
          fi

          echo "Google Drive File ID detected"

          # Download with retries
          gdown --no-cookies "$FILE_ID" \
            -O source.zip \
            --retries 3

          if [ ! -s source.zip ]; then
            echo "::error::Download failed"
            exit 1
          fi

          if ! unzip -tq source.zip; then
            echo "::error::Invalid ZIP file"
            exit 1
          fi

          echo "Download successful!"

      # 7. Extract ZIP
      - name: Extract Source Code
        run: |
          mkdir -p source
          unzip -q source.zip -d source

          echo "ZIP extracted"

          find source -maxdepth 3 -type f | head -100

      # 8. Detect Android Project
      - name: Locate Android Project
        run: |
          PROJECT_DIR=""

          # Find Gradle Wrapper
          GRADLE_FILE=$(find source \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            chmod +x "$GRADLE_FILE"

          else
            SETTINGS_FILE=$(find source \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path "*/.gradle/*" \
              | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 9. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 10. Build Debug APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      # 11. Collect APK
      - name: Collect APK Files
        run: |
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp --parents {} output/ \;

          if ! find output -name "*.apk" | grep -q .; then
            echo "::error::No APK generated"
            exit 1
          fi

          echo "Generated APK:"
          find output -name "*.apk"

      # 12. Upload Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZooPLAY-TV-APK
          path: output/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Prepare Release
      - name: Prepare Release
        run: |
          mkdir -p release

          find output \
            -type f \
            -name "*.apk" \
            | while read -r apk; do
                cp "$apk" "release/$(basename "$apk")"
              done

          ls -lh release/

      # 14. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ZooPLAY TV ${{ inputs.release_tag }}
          body: |
            ZooPLAY Android TV APK

            Android Target: API 22+
            Build Type: Debug
            Build System: GitHub Actions
            Version: 1.0.0

          files: release/*.apk
          fail_on_unmatched_files: true
          make_latest: true
